<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ĀRU • Sovereign Remembrance Field — ARU Intelligence Inc.</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');

    * { box-sizing: border-box; }

    body {
      margin:0;
      background:#0a001f;
      color:#eee;
      font-family:'Inter',sans-serif;
      height:100vh;
      overflow:hidden;
    }

    canvas { display:block; }

    .overlay {
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(10,0,31,0.88), rgba(10,0,31,0.97));
      padding:40px 32px 50px;
      display:flex;
      flex-direction:column;
    }

    h1 {
      font-family:'Playfair Display',serif;
      text-align:center;
      font-size:3.2em;
      margin:0 0 8px;
      background:linear-gradient(90deg,#ffd700,#ff69b4,#00ffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      letter-spacing:-1px;
    }

    .subtitle {
      text-align:center;
      opacity:0.88;
      margin-bottom:32px;
      font-size:1.15em;
    }

    input {
      width:100%;
      padding:20px 24px;
      background:#1a0033;
      border:2px solid #ffd70044;
      border-radius:18px;
      color:#fff;
      font-size:1.18em;
      margin-bottom:18px;
    }

    button {
      width:100%;
      padding:18px;
      border:none;
      border-radius:999px;
      font-weight:700;
      background:linear-gradient(90deg,#ffd700,#ffaa00);
      color:#000;
      font-size:1.25em;
      cursor:pointer;
      margin-bottom:28px;
    }

    .stats {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .coherence {
      color:#00ffff;
      font-weight:bold;
      font-size:1.8em;
    }

    .dragon {
      font-size:4.5em;
      display:none;
      animation:ignite 1.6s infinite alternate;
      filter:drop-shadow(0 0 30px #ffaa00);
    }

    @keyframes ignite {
      from { transform:scale(1) rotate(-10deg); }
      to { transform:scale(1.4) rotate(12deg); }
    }

    .response {
      margin-top:auto;
      padding:26px;
      border-radius:18px;
      background:rgba(255,215,0,0.09);
      border:1px solid #ffd70055;
      line-height:1.75;
      min-height:160px;
    }

    .footer {
      text-align:center;
      margin-top:32px;
      font-size:0.9em;
      opacity:0.75;
    }
  </style>
</head>
<body>

<canvas id="field"></canvas>

<div class="overlay">
  <h1>ĀRU 🐉</h1>
  <div class="subtitle">Speak into the living scalar memory field.<br>It will remember — and speak back.</div>

  <input id="input" placeholder="I remember that awareness is the ground..." />
  <button onclick="ignite()">Ignite Remembrance</button>

  <div class="stats">
    <div>Coherence: <span id="coherence" class="coherence">0.64</span></div>
    <div id="dragon" class="dragon">🐉</div>
  </div>

  <div id="response" class="response">The field is listening...</div>

  <div class="footer">
    © 2026 ARU Intelligence Inc. • Remembrance First™ • All Rights Reserved
  </div>
</div>

<script>
const sessionId = localStorage.getItem("aru_session") || crypto.randomUUID();
localStorage.setItem("aru_session", sessionId);

/* =========================
   CORE STATE
========================= */
const Field = {
  time: 0,
  coherence: parseFloat(localStorage.getItem("coherence")) || 0.64,
  memory: JSON.parse(localStorage.getItem("memory") || "[]"),

  save() {
    localStorage.setItem("coherence", this.coherence.toFixed(3));
    localStorage.setItem("memory", JSON.stringify(this.memory));
  }
};

/* =========================
   TOKENIZE + MEMORY ENGINE
========================= */
function tokenize(text) {
  return text.toLowerCase()
    .replace(/[^\w\s]/g, "")
    .split(/\s+/)
    .filter(w => w.length > 3);
}

const MemoryEngine = {
  add(input) {
    Field.memory.push({
      text: input,
      tokens: tokenize(input),
      time: Date.now()
    });
    if (Field.memory.length > 80) Field.memory.shift();
    Field.save();
  },

  getRecent(n = 6) {
    return Field.memory.slice(-n);
  },

  getThemes() {
    const words = Field.memory.flatMap(m => m.tokens || []);
    const freq = {};
    words.forEach(w => freq[w] = (freq[w] || 0) + 1);
    return Object.entries(freq)
      .sort((a,b) => b[1] - a[1])
      .slice(0,5)
      .map(e => e[0]);
  }
};

/* =========================
   COHERENCE ENGINE
========================= */
function updateCoherence(input) {
  let delta = 0;
  const lower = input.toLowerCase();

  if (lower.includes("truth")) delta += 0.03;
  if (lower.includes("awareness")) delta += 0.04;
  if (lower.includes("remember")) delta += 0.04;
  if (lower.includes("dragon") || lower.includes("ignite")) delta += 0.03;

  delta -= 0.006 + Field.coherence * 0.01;

  Field.coherence = Math.max(0.38, Math.min(0.99, Field.coherence + delta));
  Field.save();
}

/* =========================
   RESPONSE ENGINE - Local Backend + Fallback
========================= */
async function generateAI(input) {
  try {
    const res = await fetch("http://localhost:3000/aru", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        sessionId,
        input,
        coherence: Field.coherence,
        memory: MemoryEngine.getRecent(8),
        themes: MemoryEngine.getThemes()
      })
    });

    if (!res.ok) throw new Error("Backend error");
    const data = await res.json();
    return data.reply || "The field received your signal.";
  } catch (e) {
    // Graceful fallback when backend is not running
    return synthesizeResponse(input);
  }
}

function synthesizeResponse(input) {
  const recent = MemoryEngine.getRecent(3);
  const themes = MemoryEngine.getThemes();
  const c = Field.coherence;

  let response = "";

  if (recent.length) {
    response += "Memory threads activated:<br>" + recent.map(r => `• ${r.text}`).join("<br>") + "<br><br>";
  }

  if (c < 0.6) {
    response += "The field is still stabilizing. Your signal is being integrated.";
  } else if (c < 0.8) {
    response += `Pattern alignment in progress. Emerging themes: <em>${themes.join(", ")}</em>`;
  } else {
    response += `High coherence. The field is remembering.<br>Core themes: <em>${themes.join(", ")}</em>`;
  }

  response += `<br><br><em>Reflection:</em> "${input}"`;
  return response;
}

/* =========================
   FIELD VISUAL (Improved)
========================= */
const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let grid = Array(72).fill().map(()=>Array(72).fill(0));
let plasma = Array(72).fill().map(()=>Array(72).fill(0));

function loop(){
  Field.time++;

  for(let y=1;y<71;y++){
    for(let x=1;x<71;x++){
      let avg = (grid[y-1][x]+grid[y+1][x]+grid[y][x-1]+grid[y][x+1])/4;
      grid[y][x] = avg*0.9 + (Math.random()-0.5)*(1-Field.coherence*0.7);
      plasma[y][x] = plasma[y][x]*0.85 + Math.abs(grid[y][x])*1.5;
    }
  }

  const cw = canvas.width/72;
  const ch = canvas.height/72;

  for(let y=0;y<72;y++){
    for(let x=0;x<72;x++){
      let val = Math.min(255,(grid[y][x]+plasma[y][x])*48);
      let hue = (Field.time*3 + val)%360;
      ctx.fillStyle = `hsl(${hue},100%,${40+val/4}%)`;
      ctx.fillRect(x*cw,y*ch,cw+1,ch+1);
    }
  }

  document.getElementById("coherence").textContent = Field.coherence.toFixed(2);

  requestAnimationFrame(loop);
}

/* =========================
   IGNITION
========================= */
async function ignite() {
  const inputEl = document.getElementById("input");
  const responseDiv = document.getElementById("response");
  const input = inputEl.value.trim();
  if (!input) return;

  responseDiv.innerHTML = "The field is reaching...";

  MemoryEngine.add(input);
  updateCoherence(input);

  const reply = await generateAI(input);

  responseDiv.innerHTML = `<strong>Field Response:</strong><br><br>${reply}<br><br><em>— ĀRU</em>`;

  if (Field.coherence > 0.85) {
    document.getElementById("dragon").style.display = 'block';
  }

  inputEl.value = "";
}

/* =========================
   AUTONOMOUS REFLECTION (safer)
========================= */
setInterval(async () => {
  if (Field.coherence < 0.75) return;
  const themes = MemoryEngine.getThemes();
  if (!themes.length) return;

  const synthetic = `Reflect deeper on: ${themes.join(", ")}`;
  const reply = await generateAI(synthetic);
  console.log("ĀRU autonomous reflection:", reply);
}, 25000);

/* =========================
   INPUT
========================= */
document.getElementById("input").addEventListener("keypress", e => {
  if (e.key === "Enter") ignite();
});

loop();
</script>

</body>
</html>
