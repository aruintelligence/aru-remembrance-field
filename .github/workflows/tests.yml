name: Field regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/field.test.cjs
      - run: node tests/benchmark.test.cjs
      - run: node tests/falsifier.test.cjs
      - run: node tests/blind-analyzer.test.cjs
      - run: node tools/benchmark-evidence.cjs research/evidence-challenge.json
      - run: node tools/falsify-evidence.cjs --seed 20261015 --runs 2000
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-receipt.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-excerpt.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-excerpt.json research/example-evidence-reference-baseline.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-excerpt.json research/example-evidence-reference-baseline.json research/example-evidence-ledger-checkpoint.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-receipt.json research/example-evidence-reference-baseline.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-brief.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-correction.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-correction-chain.json
      - run: node tools/verify-evidence-receipt.cjs research/example-evidence-correction-packet.json research/example-evidence-ledger-baseline.json
      - run: node tools/verify-proof.cjs research/example-proof.json
      - run: node tools/verify-proof.cjs research/example-proof-v2.json
      - run: node tools/verify-proof.cjs research/example-proof-v3.json
      - run: node tools/verify-trajectory.cjs research/example-trajectory.json
      - run: node tools/verify-trajectory.cjs research/example-trajectory-v2.json
      - run: node tools/verify-trajectory.cjs research/example-trajectory-v3.json
      - run: node tools/verify-memory-challenge.cjs research/example-memory-challenge.json
      - run: node tools/verify-memory-challenge.cjs research/example-memory-challenge-v3.json
      - run: node tools/verify-blind-trial.cjs research/example-blind-trial.json
      - run: node tools/verify-blind-trial.cjs research/example-blind-trial-v2.json
      - run: node tools/verify-blind-trial.cjs research/example-blind-trial-v3.json
      - run: node tools/analyze-blind-trials.cjs research/example-blind-trial.json
      - run: node tools/analyze-blind-trials.cjs --check-plan research/example-blind-trial-plan.json
      - run: node tools/analyze-blind-trials.cjs --plan research/example-blind-trial-plan.json research/example-blind-trial.json
      - run: node tools/analyze-blind-trials.cjs --check-plan research/example-blind-trial-plan-v2.json
      - run: node tools/analyze-blind-trials.cjs --plan research/example-blind-trial-plan-v2.json research/example-blind-trial-v2.json
      - run: node tools/analyze-blind-trials.cjs --check-plan research/example-blind-trial-plan-v3.json
      - run: node tools/analyze-blind-trials.cjs --plan research/example-blind-trial-plan-v3.json research/example-blind-trial-v3.json
      - run: |
          python3 tools/differential-field-v2.py --seed 20261015 --runs 2000 --json | tee /tmp/aru-score-differential.json
          diff -u research/example-score-differential-report.json /tmp/aru-score-differential.json
      - run: |
          python3 tools/differential-field-v3.py --seed 20261015 --runs 2000 --json | tee /tmp/aru-score-differential-v3.json
          diff -u research/example-score-differential-report-v3.json /tmp/aru-score-differential-v3.json
      - run: |
          python3 tools/differential-brief.py --seed 20261015 --runs 2000 --json | tee /tmp/aru-brief-differential.json
          diff -u research/example-brief-differential-report.json /tmp/aru-brief-differential.json
      - run: |
          python3 tools/differential-correction.py --seed 20261015 --runs 2000 --json | tee /tmp/aru-correction-differential.json
          diff -u research/example-correction-differential-report.json /tmp/aru-correction-differential.json
